[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "corporate-travel-agent"
version = "0.1.0"
description = "Evidence-first corporate travel planning and compliance agent framework"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "pydantic>=2.9,<3",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
llm = [
  "openai>=1.66,<3",
]
persistence = [
  "alembic>=1.14,<2",
  "psycopg[binary]>=3.2,<4",
  "sqlalchemy>=2.0,<3",
]
dev = [
  "mypy>=1.14,<2",
  "pytest>=8.3,<9",
  "pytest-cov>=5,<7",
  "ruff>=0.7,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/corporate_travel_agent"]

[tool.hatch.build.targets.wheel.force-include]
"src/corporate_travel_agent/config/default_policy.json" = "corporate_travel_agent/config/default_policy.json"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
files = ["src"]
mypy_path = "src"
ignore_missing_imports = true
check_untyped_defs = true
no_implicit_optional = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_unreachable = false
show_error_codes = true

# 严格模式先开在最该守住的地方：领域模型、状态机、政策引擎、仓储端口、编排器。
# 其余模块按默认模式检查；扩大严格范围时把模块名加进这张表。
[[tool.mypy.overrides]]
module = [
  "corporate_travel_agent.domain.*",
  "corporate_travel_agent.workflow.*",
  "corporate_travel_agent.policy.*",
  "corporate_travel_agent.services.repositories",
  "corporate_travel_agent.agent.orchestrator.*",
]
disallow_untyped_defs = true
disallow_incomplete_defs = true
disallow_untyped_calls = true
disallow_any_generics = true
disallow_subclassing_any = true
disallow_untyped_decorators = true
warn_return_any = true
strict_equality = true
